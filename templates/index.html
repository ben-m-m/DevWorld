{% extends "base.html" %}

{% block title %}
Home
{% endblock %}

{% block content %}
<h1>Welcome to DevWorld</h1>
<p>Your personal Github Engineering Dashboard.</p>

{% if user %}
<div class="card mt-4" style="max-width: 500px;">
    <div class="card-body">
        <img src="{{ user.avatar_url }}" alt="Avatar" class="img-fluid rounded-circle mb-3" style="width: 100px; height: 100px;">
        <h2>{{ user.name }}</h2>
        <p>{{ user.bio }}</p>
        <p> Followers: {{ user.followers }}</p>
        <a href="{{url_for('github.dashboard')}}" class="btn btn-primary">View Repositories</a>
    </div>
</div>
{% endif %}
{% endblock %}
