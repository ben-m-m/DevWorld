{% extends "base.html" %}

{% block title %}
Home
{% endblock %}

{% block content %}
<div class="text-center mt-5">
    <h1>Welcome to DevWorld</h1>
    <p>Your personal Github Engineering Platform.</p>

    <form
        action="{{ url_for('github.search') }}" method="POST" class="row justify-content-center mt-4">
        <div class="col-md-6">
            <input type="text" name="username" class="form-control form-control-lg" placeholder="Enter GitHub username"
                required>

        </div>
        <div class="col-md-2">
            <button class="btn btn-primary btn-lg w-100">Search</button>
        </div>
    </form>
</div>
{% endblock %}
